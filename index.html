<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captura y Subida</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ... (Mismo CSS de antes) ... */
    :root { --primary: #3ecf8e; --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #ffffff; --text-secondary: #a0a0a0; --danger: #ff5252; }
    body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 600px; background-color: var(--card-bg); border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); margin-bottom: 30px; }
    .upload-area { border: 2px dashed #444; border-radius: 8px; padding: 30px 10px; text-align: center; cursor: pointer; }
    .btn { width: 100%; background-color: var(--primary); color: #000; font-weight: bold; border: none; padding: 14px; border-radius: 8px; cursor: pointer; margin-top: 15px; }
    #status-msg { margin-top: 15px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📷 Captura & Subida</h1>
    <input type="file" id="mediaInput" accept="image/*,video/*" capture="environment" style="display:none" onchange="handleFileSelect()" />
    <div class="upload-area" onclick="document.getElementById('mediaInput').click()">
      <p>Toca aquí para seleccionar archivo</p>
    </div>
    <div id="preview-container"></div>
    <button id="uploadBtn" class="btn" style="display: none;" onclick="uploadFile()">Subir a la nube</button>
    <div id="status-msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pqufeiliyerbfnkukzay.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxdWZlaWxpeWVyYmZua3VremF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NzEzMzYsImV4cCI6MjEwMjI0NzMzNn0.F383-Gb1vrbLlaZa-chEwiylPPesh_pWurQQHVhf5gs';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedFile = null;
    let ffmpegInstance = null;

    // Carga de scripts dinámica desde CDN (más seguro que archivos locales)
    async function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    async function initFFmpeg() {
      if (ffmpegInstance) return;
      document.getElementById('status-msg').textContent = '⏳ Cargando compresor...';
      
      // Cargamos las librerías desde CDN
      await loadScript('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js');
      await loadScript('https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js');

      const { FFmpeg } = window.FFmpegWASM;
      ffmpegInstance = new FFmpeg();
      await ffmpegInstance.load({
        coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
        wasmURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm'
      });
    }

    async function compressVideo(file) {
      await initFFmpeg();
      document.getElementById('status-msg').textContent = '⚙️ Comprimiendo...';
      const { fetchFile } = window.FFmpegUtil;
      await ffmpegInstance.writeFile(file.name, await fetchFile(file));
      await ffmpegInstance.exec(['-i', file.name, '-vf', 'scale=-2:720', '-c:v', 'libx264', '-crf', '28', 'output.mp4']);
      const data = await ffmpegInstance.readFile('output.mp4');
      return new File([data.buffer], `compressed_${file.name}`, { type: 'video/mp4' });
    }

    function handleFileSelect() {
      selectedFile = document.getElementById('mediaInput').files[0];
      document.getElementById('uploadBtn').style.display = 'block';
    }

    async function uploadFile() {
      const btn = document.getElementById('uploadBtn');
      btn.disabled = true;
      let fileToUpload = selectedFile;
      if (selectedFile.type.startsWith('video/') && selectedFile.size > 40 * 1024 * 1024) {
        fileToUpload = await compressVideo(selectedFile);
      }
      
      document.getElementById('status-msg').textContent = 'Subiendo...';
      const { error } = await supabaseClient.storage.from('PhotoEvent').upload(`${Date.now()}_${selectedFile.name}`, fileToUpload);
      
      if (error) alert('Error: ' + error.message);
      else alert('¡Subido!');
      btn.disabled = false;
    }
  </script>
</body>
</html>
