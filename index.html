<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara a Supabase</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* --- RESET Y ESTILOS BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        h2 {
            font-weight: 800;
            font-size: 1.5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #3ecf8e, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .preview-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed rgba(255, 255, 255, 0.2);
        }

        #image-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .placeholder-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            position: absolute;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* --- NUEVO ESTILO PARA OCULTAR EL INPUT DE FORMA SEGURA --- */
        .hidden-input {
            width: 0.1px;
            height: 0.1px;
            opacity: 0;
            overflow: hidden;
            position: absolute;
            z-index: -1;
        }

        .btn {
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: inline-block; /* Necesario para que el label actúe como botón */
        }

        .btn-camera {
            background: #3b82f6; 
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-camera:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6); }

        .btn-upload {
            background: #3ecf8e; 
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(62, 207, 142, 0.4);
        }

        .btn-upload:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(62, 207, 142, 0.6); }

        .btn:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-cancel {
            background: transparent;
            color: #f87171;
            border: 1px solid #f87171;
        }

        #status {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            min-height: 20px;
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .status-ready { background: rgba(62, 207, 142, 0.2); color: #3ecf8e; opacity: 1;}
        .status-loading { background: rgba(59, 130, 246, 0.2); color: #60a5fa; opacity: 1;}
        .status-error { background: rgba(239, 68, 68, 0.2); color: #f87171; opacity: 1;}
    </style>
</head>
<body>

    <div class="app-container">
        <h2>Snap & Cloud ☁️</h2>
        
        <div class="preview-wrapper">
            <span class="placeholder-text" id="placeholder">Sin imagen</span>
            <img id="image-preview" alt="Previsualización de la cámara">
        </div>
        
        <div class="controls">
            <!-- INPUT OCULTO SEGURO -->
            <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden-input">
            
            <!-- EL LABEL ACTÚA COMO BOTÓN NATIVO -->
            <label for="camera-input" id="btn-take-photo" class="btn btn-camera">📸 Tomar Foto</label>
            
            <button id="btn-send-photo" class="btn btn-upload" style="display: none;">🚀 Enviar a la nube</button>
            <!-- REUSAMOS EL LABEL PARA VOLVER A TOMAR LA FOTO -->
            <label for="camera-input" id="btn-retake" class="btn btn-cancel" style="display: none;">Volver a tomar</label>
        </div>
        
        <div id="status">Esperando...</div>
    </div>

    <script>
        const SUPABASE_URL = 'https://pqufeiliyerbfnkukzay.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxdWZlaWxpeWVyYmZua3VremF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NzEzMzYsImV4cCI6MjEwMjI0NzMzNn0.F383-Gb1vrbLlaZa-chEwiylPPesh_pWurQQHVhf5gs';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const cameraInput = document.getElementById('camera-input');
        const btnTakePhoto = document.getElementById('btn-take-photo');
        const btnSendPhoto = document.getElementById('btn-send-photo');
        const btnRetake = document.getElementById('btn-retake');
        const imagePreview = document.getElementById('image-preview');
        const placeholder = document.getElementById('placeholder');
        const statusText = document.getElementById('status');

        let currentFile = null; 

        function updateStatus(message, className) {
            statusText.innerText = message;
            statusText.className = className;
        }

        // --- FLUJO: PREVISUALIZAR LA FOTO ---
        cameraInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            
            if (file) {
                currentFile = file;
                
                const imageUrl = URL.createObjectURL(file);
                imagePreview.src = imageUrl;
                
                imagePreview.style.display = 'block';
                placeholder.style.display = 'none';
                
                btnTakePhoto.style.display = 'none';
                btnSendPhoto.style.display = 'block';
                btnRetake.style.display = 'inline-block'; // Mostramos el label de reintento
                
                updateStatus("¡Se ve genial! ¿La enviamos?", "status-ready");
            }
        });

        // --- FLUJO: ENVIAR A SUPABASE ---
        btnSendPhoto.addEventListener('click', async () => {
            if (!currentFile) return;

            btnSendPhoto.disabled = true;
            // Quitamos pointer-events al label temporalmente para que no se pueda clickear mientras sube
            btnRetake.style.pointerEvents = 'none';
            btnRetake.style.opacity = '0.5';
            
            updateStatus("Subiendo a la nube...", "status-loading");

            const fileExt = currentFile.name.split('.').pop();
            const fileName = `foto_${Date.now()}.${fileExt}`;

            const { data, error } = await supabase.storage
                .from('fotos') 
                .upload(fileName, currentFile, {
                    cacheControl: '3600',
                    upsert: false
                });

            if (error) {
                console.error("Error al subir: ", error);
                updateStatus("Error al guardar. Intenta de nuevo.", "status-error");
                btnSendPhoto.disabled = false;
                btnRetake.style.pointerEvents = 'auto';
                btnRetake.style.opacity = '1';
            } else {
                updateStatus("¡Foto guardada con éxito!", "status-ready");
                
                setTimeout(() => {
                    currentFile = null;
                    imagePreview.src = '';
                    imagePreview.style.display = 'none';
                    placeholder.style.display = 'block';
                    
                    btnTakePhoto.style.display = 'inline-block';
                    btnSendPhoto.style.display = 'none';
                    btnRetake.style.display = 'none';
                    
                    btnSendPhoto.disabled = false;
                    btnRetake.style.pointerEvents = 'auto';
                    btnRetake.style.opacity = '1';
                    statusText.style.opacity = '0';
                    
                    // Limpiamos el input por si suben la misma foto seguida
                    cameraInput.value = '';
                }, 2500);
            }
        });
    </script>
</body>
</html>
