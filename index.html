<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captura y Subida</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Cargamos FFmpeg desde CDN -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
  
  <style>
    /* ... (Mismo CSS que ya tienes) ... */
    :root { --primary: #3ecf8e; --bg-color: #121212; --card-bg: #1e1e1e; --text-color: #ffffff; }
    body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 600px; background-color: var(--card-bg); padding: 24px; border-radius: 12px; }
    .btn { width: 100%; background-color: var(--primary); padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    #status-msg { margin-top: 15px; text-align: center; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Subida con Compresión</h1>
    <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none" onchange="handleFileSelect()" />
    <button class="btn" onclick="document.getElementById('mediaInput').click()">Seleccionar Archivo</button>
    <div id="preview-container"></div>
    <button id="uploadBtn" class="btn" style="display:none" onclick="uploadFile()">Subir a la nube</button>
    <div id="status-msg"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pqufeiliyerbfnkukzay.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxdWZlaWxpeWVyYmZua3VremF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NzEzMzYsImV4cCI6MjEwMjI0NzMzNn0.F383-Gb1vrbLlaZa-chEwiylPPesh_pWurQQHVhf5gs';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedFile = null;
    let ffmpeg = null;

    async function loadFFmpeg() {
      if (ffmpeg) return;
      const { FFmpeg } = window.FFmpegWASM;
      ffmpeg = new FFmpeg();
      await ffmpeg.load({
        coreURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.js',
        wasmURL: 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd/ffmpeg-core.wasm'
      });
    }

    async function compressVideo(file) {
      document.getElementById('status-msg').textContent = '⚙️ Comprimiendo video (esto puede tardar)...';
      await loadFFmpeg();
      const { fetchFile } = window.FFmpegUtil;
      
      await ffmpeg.writeFile('input.mp4', await fetchFile(file));
      // CRF 32 es un equilibrio entre tamaño y calidad. A mayor numero, menor tamaño.
      await ffmpeg.exec(['-i', 'input.mp4', '-vf', 'scale=-2:720', '-c:v', 'libx264', '-crf', '32', 'output.mp4']);
      const data = await ffmpeg.readFile('output.mp4');
      return new File([data.buffer], file.name, { type: 'video/mp4' });
    }

    function handleFileSelect() {
      selectedFile = document.getElementById('mediaInput').files[0];
      document.getElementById('uploadBtn').style.display = 'block';
    }

    async function uploadFile() {
      const statusMsg = document.getElementById('status-msg');
      let fileToUpload = selectedFile;

      // Comprimir solo si es video y mayor a 25MB
      if (selectedFile.type.startsWith('video/') && selectedFile.size > 25 * 1024 * 1024) {
        fileToUpload = await compressVideo(selectedFile);
      }

      statusMsg.textContent = '⏳ Subiendo a Supabase...';
      const { error } = await supabaseClient.storage.from('PhotoEvent').upload(`${Date.now()}_${fileToUpload.name}`, fileToUpload);
      
      if (error) statusMsg.textContent = '❌ Error: ' + error.message;
      else statusMsg.textContent = '✅ ¡Subido con éxito!';
    }
  </script>
</body>
</html>
