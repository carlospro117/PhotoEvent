<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Captura y Subida de Archivos</title>
  
  <!-- CDN de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #3ecf8e;
      --primary-hover: #34b27b;
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --text-secondary: #a0a0a0;
      --danger: #ff5252;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      margin-bottom: 30px;
    }

    h1, h2 { text-align: center; margin-bottom: 20px; font-weight: 600; }
    h2 { font-size: 1.2rem; color: var(--text-secondary); border-bottom: 1px solid #333; padding-bottom: 10px; }

    .upload-area {
      border: 2px dashed #444;
      border-radius: 8px;
      padding: 30px 10px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .upload-area:hover { border-color: var(--primary); }

    .btn {
      width: 100%;
      background-color: var(--primary);
      color: #000;
      font-weight: bold;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }

    .btn:hover { background-color: var(--primary-hover); }
    .btn:disabled { background-color: #555; color: #888; cursor: not-allowed; }

    #preview-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    #preview-container img, #preview-container video {
      max-width: 100%;
      max-height: 350px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    #status-msg {
      margin-top: 15px;
      text-align: center;
      font-size: 0.95rem;
      word-break: break-all;
    }

    /* Estilos de la Galería */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      width: 100%;
      margin-top: 15px;
    }

    .gallery-item {
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    .gallery-item img, .gallery-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>📷 Captura & Subida</h1>
    
    <!-- Input oculto que abre la cámara directamente en celulares -->
    <input type="file" id="mediaInput" accept="image/*,video/*" capture="environment" style="display:none" onchange="handleFileSelect()" />

    <div class="upload-area" onclick="document.getElementById('mediaInput').click()">
      <p style="font-size: 2rem;">📸 / 🎥</p>
      <p style="margin-top: 10px; color: var(--text-secondary);">Toca aquí para tomar foto, grabar video o seleccionar archivo</p>
    </div>

    <div id="preview-container"></div>

    <button id="uploadBtn" class="btn" style="display: none;" onclick="uploadFile()">Subir a la nube</button>
    
    <div id="status-msg"></div>
  </div>

  <!-- Sección de archivos subidos -->
  <div class="container">
    <h2>📁 Archivos Subidos</h2>
    <div id="gallery" class="gallery-grid">
      <p style="color: var(--text-secondary); text-align: center; grid-column: 1 / -1;">Cargando archivos...</p>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ CONFIGURA TUS CREDENCIALES AQUÍ
    // ==========================================
    const SUPABASE_URL = 'https://pqufeiliyerbfnkukzay.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxdWZlaWxpeWVyYmZua3VremF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2NzEzMzYsImV4cCI6MjEwMjI0NzMzNn0.F383-Gb1vrbLlaZa-chEwiylPPesh_pWurQQHVhf5gs';
    const BUCKET_NAME = 'PhotoEvent';

    // Inicializar cliente de Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let selectedFile = null;

    // Manejar selección o captura de archivo
    function handleFileSelect() {
      const input = document.getElementById('mediaInput');
      const previewContainer = document.getElementById('preview-container');
      const uploadBtn = document.getElementById('uploadBtn');
      const statusMsg = document.getElementById('status-msg');

      statusMsg.textContent = '';
      previewContainer.innerHTML = '';

      if (input.files && input.files[0]) {
        selectedFile = input.files[0];

        // Validación de tamaño (Máximo 50 MB)
        const MAX_SIZE = 50 * 1024 * 1024;
        if (selectedFile.size > MAX_SIZE) {
          statusMsg.style.color = 'var(--danger)';
          statusMsg.textContent = '❌ El archivo excede el tamaño máximo permitido (50 MB).';
          uploadBtn.style.display = 'none';
          return;
        }

        // Crear vista previa
        const fileURL = URL.createObjectURL(selectedFile);
        if (selectedFile.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = fileURL;
          previewContainer.appendChild(img);
        } else if (selectedFile.type.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = fileURL;
          video.controls = true;
          previewContainer.appendChild(video);
        }

        uploadBtn.style.display = 'block';
      }
    }

    // Subir archivo a Supabase Storage
    async function uploadFile() {
      if (!selectedFile) return;

      const uploadBtn = document.getElementById('uploadBtn');
      const statusMsg = document.getElementById('status-msg');

      uploadBtn.disabled = true;
      statusMsg.style.color = 'var(--text-secondary)';
      statusMsg.textContent = '⏳ Subiendo archivo... por favor espera.';

      // Generar nombre único usando timestamp + string aleatorio
      const fileExt = selectedFile.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;

      const { data, error } = await supabaseClient.storage
        .from(BUCKET_NAME)
        .upload(fileName, selectedFile);

      if (error) {
        console.error(error);
        statusMsg.style.color = 'var(--danger)';
        statusMsg.textContent = '❌ Error al subir: ' + error.message;
        uploadBtn.disabled = false;
      } else {
        statusMsg.style.color = 'var(--primary)';
        statusMsg.textContent = '✅ ¡Archivo subido con éxito!';
        
        // Limpiar formulario y refrescar galería
        document.getElementById('mediaInput').value = '';
        document.getElementById('preview-container').innerHTML = '';
        uploadBtn.style.display = 'none';
        uploadBtn.disabled = false;
        selectedFile = null;

        loadGallery();
      }
    }

    // Cargar y mostrar los archivos subidos al bucket
    async function loadGallery() {
      const gallery = document.getElementById('gallery');
      
      const { data, error } = await supabaseClient.storage
        .from(BUCKET_NAME)
        .list('', { limit: 20, sortBy: { column: 'created_at', order: 'desc' } });

      if (error || !data || data.length === 0) {
        gallery.innerHTML = '<p style="color: var(--text-secondary); text-align: center; grid-column: 1 / -1;">No hay archivos subidos aún.</p>';
        return;
      }

      gallery.innerHTML = '';

      data.forEach(item => {
        // Ignorar carpetas o archivos ocultos de sistema
        if (item.name === '.emptyFolderPlaceholder') return;

        const { data: publicUrlData } = supabaseClient.storage
          .from(BUCKET_NAME)
          .getPublicUrl(item.name);

        const fileUrl = publicUrlData.publicUrl;
        const div = document.createElement('div');
        div.className = 'gallery-item';

        // Detectar tipo por extensión de archivo
        const isVideo = item.name.match(/\.(mp4|webm|ogg|mov)$/i);

        if (isVideo) {
          div.innerHTML = `<video src="${fileUrl}" controls></video>`;
        } else {
          div.innerHTML = `<a href="${fileUrl}" target="_blank"><img src="${fileUrl}" alt="Archivo subido" /></a>`;
        }

        gallery.appendChild(div);
      });
    }

    // Cargar la galería automáticamente al abrir la página
    window.addEventListener('DOMContentLoaded', loadGallery);
  </script>
</body>
</html>
